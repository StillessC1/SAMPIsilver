services:
  - type: web
    name: sampisilver-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sampisilver-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false

    healthCheckPath: /api/health/

databases:
  - name: sampisilver-db
    plan: free
    region: frankfurt
